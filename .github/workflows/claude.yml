name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@beta
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read
          
          # Optional: Specify model (defaults to Claude Sonnet 4, uncomment for Claude Opus 4)
          model: "claude-opus-4-20250514"
          
          # Optional: Customize the trigger phrase (default: @claude)
          # trigger_phrase: "/claude"
          
          # Optional: Trigger when specific user is assigned to an issue
          assignee_trigger: "claude-bot"
          
          # Comprehensive developer tools for interactive Claude assistance
          allowed_tools: |
            Bash(apt:*),Bash(apt-get:*),Bash(apt-cache:*),Bash(dpkg:*),Bash(sudo:*),
            Bash(git:*),Bash(gh:*),Bash(svn:*),Bash(hg:*),
            Bash(cmake:*),Bash(make:*),Bash(ninja:*),Bash(autoconf:*),Bash(automake:*),Bash(./configure:*),Bash(pkg-config:*),Bash(ldconfig:*),
            Bash(gcc:*),Bash(g++:*),Bash(clang:*),Bash(clang++:*),Bash(ld:*),Bash(ar:*),Bash(nm:*),Bash(objdump:*),Bash(readelf:*),Bash(ldd:*),Bash(c++filt:*),
            Bash(gdb:*),Bash(lldb:*),Bash(valgrind:*),Bash(strace:*),Bash(ltrace:*),Bash(perf:*),Bash(time:*),Bash(gprof:*),Bash(gcov:*),Bash(lcov:*),
