name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'
    
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@beta
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # Optional: Specify model (defaults to Claude Sonnet 4, uncomment for Claude Opus 4)
          model: "claude-opus-4-20250514"
          
          # Direct prompt for automated review (no @claude mention needed)
          direct_prompt: |
            Please review this pull request and provide feedback on:
            - Code quality and best practices
            - Potential bugs or issues
            - Performance considerations
            - Security concerns
            - Test coverage
            
            Be constructive and helpful in your feedback.

          # Optional: Use sticky comments to make Claude reuse the same comment on subsequent pushes to the same PR
          # use_sticky_comment: true
          
          # Optional: Customize review based on file types
          # direct_prompt: |
          #   Review this PR focusing on:
          #   - For TypeScript files: Type safety and proper interface usage
          #   - For API endpoints: Security, input validation, and error handling
          #   - For React components: Performance, accessibility, and best practices
          #   - For tests: Coverage, edge cases, and test quality
          
          # Optional: Different prompts for different authors
          # direct_prompt: |
          #   ${{ github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR' && 
          #   'Welcome! Please review this PR from a first-time contributor. Be encouraging and provide detailed explanations for any suggestions.' ||
          #   'Please provide a thorough code review focusing on our coding standards and best practices.' }}
          
          # Comprehensive developer tools for code review and analysis
          allowed_tools: |
            Bash(apt:*),Bash(apt-get:*),Bash(apt-cache:*),Bash(dpkg:*),Bash(sudo:*),
            Bash(git:*),Bash(gh:*),Bash(svn:*),Bash(hg:*),
            Bash(cmake:*),Bash(make:*),Bash(ninja:*),Bash(autoconf:*),Bash(automake:*),Bash(./configure:*),Bash(pkg-config:*),Bash(ldconfig:*),
            Bash(gcc:*),Bash(g++:*),Bash(clang:*),Bash(clang++:*),Bash(ld:*),Bash(ar:*),Bash(nm:*),Bash(objdump:*),Bash(readelf:*),Bash(ldd:*),Bash(c++filt:*),
            Bash(gdb:*),Bash(lldb:*),Bash(valgrind:*),Bash(strace:*),Bash(ltrace:*),Bash(perf:*),Bash(time:*),Bash(gprof:*),Bash(gcov:*),Bash(lcov:*),
            Bash(cppcheck:*),Bash(clang-tidy:*),Bash(clang-format:*),Bash(cpplint:*),Bash(include-what-you-use:*),Bash(iwyu:*),Bash(shellcheck:*),Bash(pylint:*),Bash(flake8:*),Bash(black:*),Bash(yapf:*),Bash(autopep8:*),Bash(eslint:*),Bash(prettier:*),Bash(rustfmt:*),Bash(gofmt:*),
            Bash(python:*),Bash(python3:*),Bash(pip:*),Bash(pip3:*),Bash(pipenv:*),Bash(poetry:*),Bash(virtualenv:*),Bash(conda:*),Bash(pytest:*),Bash(unittest:*),Bash(nose:*),
            Bash(node:*),Bash(npm:*),Bash(npx:*),Bash(yarn:*),Bash(pnpm:*),Bash(nvm:*),Bash(jest:*),Bash(mocha:*),Bash(vitest:*),
