name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'
    
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@beta
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # Optional: Specify model (defaults to Claude Sonnet 4, uncomment for Claude Opus 4)
          model: "claude-opus-4-20250514"
          
          # Direct prompt for automated review (no @claude mention needed)
          direct_prompt: |
            Please review this pull request and provide feedback on:
            - Code quality and best practices
            - Potential bugs or issues
            - Performance considerations
            - Security concerns
            - Test coverage
            
            Be constructive and helpful in your feedback.

          # Optional: Use sticky comments to make Claude reuse the same comment on subsequent pushes to the same PR
          # use_sticky_comment: true
          
          # Optional: Customize review based on file types
          # direct_prompt: |
          #   Review this PR focusing on:
          #   - For TypeScript files: Type safety and proper interface usage
          #   - For API endpoints: Security, input validation, and error handling
          #   - For React components: Performance, accessibility, and best practices
          #   - For tests: Coverage, edge cases, and test quality
          
          # Optional: Different prompts for different authors
          # direct_prompt: |
          #   ${{ github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR' && 
          #   'Welcome! Please review this PR from a first-time contributor. Be encouraging and provide detailed explanations for any suggestions.' ||
          #   'Please provide a thorough code review focusing on our coding standards and best practices.' }}
          
          # Optional: Add specific tools for running tests or linting
          allowed_tools: "Bash(apt-get update:*),Bash(apt-get install:*),Bash(apt-get upgrade:*),Bash(apt update:*),Bash(apt install:*),Bash(apt upgrade:*),Bash(sudo:*),Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(git pull:*),Bash(git merge:*),Bash(git checkout:*),Bash(git branch:*),Bash(git clone:*),Bash(git fetch:*),Bash(git reset:*),Bash(git stash:*),Bash(git cherry-pick:*),Bash(git diff:*),Bash(git log:*),Bash(git status:*),Bash(git rebase:*),Bash(gh api:*),Bash(gh pr:*),Bash(gh repo:*),Bash(gh run:*),Bash(gh workflow:*),Bash(cmake:*),Bash(make:*),Bash(g++:*),Bash(gcc:*),Bash(clang:*),Bash(cppcheck),Bash(cargo:*),Bash(go:*),Bash(node:*),Bash(npm install:*),Bash(npm run build:*),Bash(npm run test:*),Bash(npm run lint:*),Bash(yarn:*),Bash(pnpm:*),Bash(pip install:*),Bash(pip3 install:*),Bash(python:*),Bash(python3:*),Bash(curl:*),Bash(wget:*),Bash(ls:*),Bash(cp:*),Bash(mv:*),Bash(rm:*),Bash(cat:*),Bash(touch:*),Bash(echo:*),Bash(find:*),Bash(grep:*),Bash(sed:*),Bash(awk:*),Bash(chmod:*),Bash(chown:*),Bash(ln:*),Bash(mkdir:*),Bash(rmdir:*),Bash(tar:*),Bash(zip:*),Bash(unzip:*),Bash(du:*),Bash(df:*),Bash(ps:*),Bash(kill:*),Bash(xargs:*),Bash(head:*),Bash(tail:*),Bash(sort:*),Bash(uniq:*),Bash(tr:*),Bash(ssh:*),Bash(ssh-keygen:*),Bash(docker build:*),Bash(docker run:*),Bash(docker compose:*),Bash(kubectl:*),Bash(systemctl:*),Bash(jq:*),Bash(shellcheck:*),Bash(yamllint:*),WebFetch(domain:**),Edit,Replace,Bash(true),Bash(test:*),Bash(done),Bash(do:*),Bash(/dev/null),Bash(npm install),Bash(npm run build),Bash(npm run test:*),Bash(npm run lint:*)"
          
          # Optional: Skip review for certain conditions
          # if: |
          #   !contains(github.event.pull_request.title, '[skip-review]') &&
          #   !contains(github.event.pull_request.title, '[WIP]')

