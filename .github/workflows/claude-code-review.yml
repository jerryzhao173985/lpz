name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'
    
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@beta
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # Optional: Specify model (defaults to Claude Sonnet 4, uncomment for Claude Opus 4)
          model: "claude-opus-4-20250514"
          
          # Direct prompt for automated review (no @claude mention needed)
          direct_prompt: |
            Please review this pull request and provide feedback on:
            - Code quality and best practices
            - Potential bugs or issues
            - Performance considerations
            - Security concerns
            - Test coverage
            
            Be constructive and helpful in your feedback.

          # Optional: Use sticky comments to make Claude reuse the same comment on subsequent pushes to the same PR
          # use_sticky_comment: true
          
          # Optional: Customize review based on file types
          # direct_prompt: |
          #   Review this PR focusing on:
          #   - For TypeScript files: Type safety and proper interface usage
          #   - For API endpoints: Security, input validation, and error handling
          #   - For React components: Performance, accessibility, and best practices
          #   - For tests: Coverage, edge cases, and test quality
          
          # Optional: Different prompts for different authors
          # direct_prompt: |
          #   ${{ github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR' && 
          #   'Welcome! Please review this PR from a first-time contributor. Be encouraging and provide detailed explanations for any suggestions.' ||
          #   'Please provide a thorough code review focusing on our coding standards and best practices.' }}
          
          # Complete LPZRobots C++ development tools - includes all actually useful tools
          # See .github/claude-allowed-tools-lpzrobots-complete.txt for categorized list
          allowed_tools: "Bash(bash:*),Bash(sh:*),Bash(zsh:*),Bash(sudo:*),Bash(git:*),Bash(gh:*),Bash(diff:*),Bash(patch:*),Bash(ls:*),Bash(cp:*),Bash(mv:*),Bash(rm:*),Bash(mkdir:*),Bash(rmdir:*),Bash(touch:*),Bash(ln:*),Bash(cd:*),Bash(pwd:*),Bash(basename:*),Bash(dirname:*),Bash(realpath:*),Bash(cat:*),Bash(head:*),Bash(tail:*),Bash(less:*),Bash(grep:*),Bash(rg:*),Bash(find:*),Bash(fd:*),Bash(xargs:*),Bash(tee:*),Bash(sort:*),Bash(uniq:*),Bash(cut:*),Bash(paste:*),Bash(tr:*),Bash(printf:*),Bash(echo:*),Bash(file:*),Bash(stat:*),Bash(du:*),Bash(df:*),Bash(wc:*),Bash(tar:*),Bash(gzip:*),Bash(gunzip:*),Bash(zip:*),Bash(unzip:*),Bash(mktemp:*),Bash(sed:*),Bash(awk:*),Bash(cmake:*),Bash(make:*),Bash(gmake:*),Bash(ninja:*),Bash(autoconf:*),Bash(automake:*),Bash(autoreconf:*),Bash(libtool:*),Bash(m4:*),Bash(pkg-config:*),Bash(pkgconf:*),Bash(./configure:*),Bash(./bootstrap:*),Bash(./autogen.sh:*),Bash(./createNewSimulation.sh:*),Bash(./start:*),Bash(./start_opt:*),Bash(./start_asan:*),Bash(./start_tsan:*),Bash(./start_ubsan:*),Bash(gcc:*),Bash(g++:*),Bash(clang:*),Bash(clang++:*),Bash(cc:*),Bash(c++:*),Bash(ld:*),Bash(ar:*),Bash(ranlib:*),Bash(nm:*),Bash(objdump:*),Bash(readelf:*),Bash(ldd:*),Bash(c++filt:*),Bash(strings:*),Bash(strip:*),Bash(otool:*),Bash(install_name_tool:*),Bash(cppcheck:*),Bash(clang-tidy:*),Bash(clang-format:*),Bash(include-what-you-use:*),Bash(iwyu:*),Bash(scan-build:*),Bash(cpplint:*),Bash(gdb:*),Bash(lldb:*),Bash(valgrind:*),Bash(perf:*),Bash(gprof:*),Bash(gcov:*),Bash(lcov:*),Bash(gcovr:*),Bash(addr2line:*),Bash(qmake:*),Bash(moc:*),Bash(uic:*),Bash(rcc:*),Bash(doxygen:*),Bash(pandoc:*),Bash(gnuplot:*),Bash(java:*),Bash(javac:*),Bash(jar:*),Bash(hyperfine:*),Bash(time:*),Bash(curl:*),Bash(wget:*),Bash(ping:*),Bash(ps:*),Bash(kill:*),Bash(killall:*),Bash(pgrep:*),Bash(pkill:*),Bash(jobs:*),Bash(top:*),Bash(uname:*),Bash(hostname:*),Bash(whoami:*),Bash(which:*),Bash(whereis:*),Bash(type:*),Bash(if:*),Bash(then:*),Bash(else:*),Bash(elif:*),Bash(fi