name: Check Claude Tools Sync

on:
  pull_request:
    paths:
      - '.github/workflows/claude.yml'
      - '.github/workflows/claude-code-review.yml'
      - '.github/claude-allowed-tools-lpzrobots-complete.txt'
  push:
    paths:
      - '.github/workflows/claude.yml'
      - '.github/workflows/claude-code-review.yml'
      - '.github/claude-allowed-tools-lpzrobots-complete.txt'

jobs:
  check-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Check if Claude tools are synchronized
        run: |
          # Extract allowed_tools from both workflows
          TOOLS_CLAUDE=$(grep -A1 "allowed_tools:" .github/workflows/claude.yml | tail -1 | sed 's/.*allowed_tools: "\(.*\)"/\1/')
          TOOLS_REVIEW=$(grep -A1 "allowed_tools:" .github/workflows/claude-code-review.yml | tail -1 | sed 's/.*allowed_tools: "\(.*\)"/\1/')
          
          # Extract from source file
          TOOLS_SOURCE=$(grep -v '^#' .github/claude-allowed-tools-lpzrobots-complete.txt | grep -v '^$' | tr -d '\n' | sed 's/,$//')
          
          # Check if all three match
          if [ "$TOOLS_CLAUDE" != "$TOOLS_SOURCE" ]; then
            echo "❌ claude.yml tools don't match source file!"
            echo "Run: .github/scripts/sync-claude-tools.sh"
            exit 1
          fi
          
          if [ "$TOOLS_REVIEW" != "$TOOLS_SOURCE" ]; then
            echo "❌ claude-code-review.yml tools don't match source file!"
            echo "Run: .github/scripts/sync-claude-tools.sh"
            exit 1
          fi
          
          if [ "$TOOLS_CLAUDE" != "$TOOLS_REVIEW" ]; then
            echo "❌ Workflow tools don't match each other!"
            echo "Run: .github/scripts/sync-claude-tools.sh"
            exit 1
          fi
          
          echo "✅ All Claude tools configurations are in sync!"